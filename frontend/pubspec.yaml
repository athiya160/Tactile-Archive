name: libri_flow
description: "LibriFlow - AI-Powered Book Sharing, Rental & Smart Library Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.9.2
  dotted_border: ^3.1.0
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.2.0
  google_fonts: ^8.0.2
  http: ^1.2.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  permission_handler: 12.0.3
  razorpay_flutter: ^1.4.5
  share_plus: ^13.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  cached_network_image: ^3.3.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4+4
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/audio/
    - assets/books/

dependency_overrides:
  firebase_core_web: 3.10.0
