services:
  # Managed Cloud PostgreSQL Database
  - type: db
    name: library-db-prod
    databaseName: library_db
    user: library_user
    plan: free

  # FastAPI Web Service
  - type: web
    name: library-backend-prod
    runtime: docker
    plan: free
    envVars:
      # Automatically wire connection string from the database service above
      - key: DATABASE_URL
        fromDatabase:
          name: library-db-prod
          property: connectionString
      
      # Generate a secure random JWT key automatically
      - key: JWT_SECRET_KEY
        generateValue: true
      
      # S3 credentials (user will be prompted to enter these in the Render dashboard)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION
        value: ap-south-1

      # Razorpay credentials (user will be prompted to enter these in the Render dashboard)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # SMTP settings for FastAPI-Mail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
