<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background-color: #FAF9F5; color: #1A1C1A; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #FFFFFF; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { background-color: #0B3D2E; color: #FFFFFF; padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; color: #D4AF37; font-size: 24px; font-weight: 600; }
        .content { padding: 40px 30px; line-height: 1.6; }
        .content p { margin-bottom: 20px; }
        .btn { display: inline-block; padding: 12px 28px; background-color: #0B3D2E; color: #FFFFFF !important; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; margin-bottom: 20px; }
        .footer { background-color: #F0EFEA; padding: 20px; text-align: center; font-size: 12px; color: #737973; }
        .footer a { color: #0B3D2E; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>The Tactile Archive</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>&copy; 2026 The Tactile Archive. All rights reserved.</p>
            <p>Need help? Contact <a href="mailto:support@tactilearchive.com">support@tactilearchive.com</a></p>
        </div>
    </div>
</body>
</html>
